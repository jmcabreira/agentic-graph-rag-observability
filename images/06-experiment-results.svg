<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" font-family="Inter,Segoe UI,system-ui,sans-serif">
  <rect width="1200" height="780" fill="#0f0f0f"/>

  <!-- Title -->
  <text x="600" y="36" fill="#f3f4f6" font-size="17" font-weight="700" text-anchor="middle">Resultado do Experimento — prod-baseline-full</text>
  <text x="600" y="56" fill="#6b7280" font-size="12" text-anchor="middle">22 perguntas · prompt label: production · dataset: orbisa-truth</text>

