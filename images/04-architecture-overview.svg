<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" font-family="Inter,Segoe UI,system-ui,sans-serif">
  <rect width="1200" height="740" fill="#0a0a0a"/>

  <text x="600" y="36" fill="#f3f4f6" font-size="17" font-weight="700" text-anchor="middle">Como tudo se conecta — Visão Geral</text>
  <text x="600" y="56" fill="#6b7280" font-size="12" text-anchor="middle">Do momento em que o usuário faz uma pergunta até aparecer no painel do Langfuse</text>

  <!-- ══════ STEP 1 ══════ -->
  <rect x="40" y="90" width="200" height="110" rx="10" fill="#171717" stroke="#3b82f6" stroke-width="2"/>
  <text x="140" y="116" fill="#93c5fd" font-size="22" text-anchor="middle">👤</text>
  <text x="140" y="138" fill="#f3f4f6" font-size="13" font-weight="700" text-anchor="middle">Usuário pergunta</text>
  <text x="140" y="156" fill="#9ca3af" font-size="10" text-anchor="middle">"Quem aprova reembolso</text>
  <text x="140" y="170" fill="#9ca3af" font-size="10" text-anchor="middle">para a Orion Freight?"</text>
  <text x="140" y="188" fill="#6b7280" font-size="9" text-anchor="middle">via terminal ou integração</text>

  <!-- STEP 1 → 2 arrow -->
  <line x1="242" y1="145" x2="318" y2="145" stroke="#3b82f6" stroke-width="2" marker-end="url(#ab)"/>

  <!-- ══════ STEP 2 ══════ -->
  <rect x="320" y="90" width="200" height="110" rx="10" fill="#171717" stroke="#3b82f6" stroke-width="2"/>
  <text x="420" y="116" fill="#93c5fd" font-size="22" text-anchor="middle">🤖</text>
  <text x="420" y="138" fill="#f3f4f6" font-size="13" font-weight="700" text-anchor="middle">Agente recebe</text>
  <text x="420" y="156" fill="#9ca3af" font-size="10" text-anchor="middle">Busca as instruções mais</text>
  <text x="420" y="170" fill="#9ca3af" font-size="10" text-anchor="middle">recentes no Langfuse</text>
  <text x="420" y="188" fill="#6b7280" font-size="9" text-anchor="middle">fallback: arquivo local</text>

  <!-- STEP 2 → 3 arrow -->
  <line x1="522" y1="145" x2="598" y2="145" stroke="#6366f1" stroke-width="2" marker-end="url(#ai)"/>

  <!-- ══════ STEP 3 ══════ -->
  <rect x="600" y="90" width="200" height="110" rx="10" fill="#171717" stroke="#6366f1" stroke-width="2"/>
  <text x="700" y="116" fill="#a5b4fc" font-size="22" text-anchor="middle">🧠</text>
  <text x="700" y="138" fill="#f3f4f6" font-size="13" font-weight="700" text-anchor="middle">Modelo pensa</text>
  <text x="700" y="156" fill="#9ca3af" font-size="10" text-anchor="middle">Claude Sonnet analisa</text>
  <text x="700" y="170" fill="#9ca3af" font-size="10" text-anchor="middle">e decide quais ferramentas</text>
  <text x="700" y="188" fill="#6b7280" font-size="9" text-anchor="middle">chamar para responder</text>

  <!-- STEP 3 → 4 arrow -->
  <line x1="802" y1="145" x2="878" y2="145" stroke="#10b981" stroke-width="2" marker-end="url(#ag)"/>

  <!-- ══════ STEP 4 ══════ -->
  <rect x="880" y="90" width="200" height="110" rx="10" fill="#171717" stroke="#10b981" stroke-width="2"/>
  <text x="980" y="116" fill="#6ee7b7" font-size="22" text-anchor="middle">🔍</text>
  <text x="980" y="138" fill="#f3f4f6" font-size="13" font-weight="700" text-anchor="middle">Helix busca</text>
  <text x="980" y="156" fill="#9ca3af" font-size="10" text-anchor="middle">Consulta o grafo Neo4j</text>
  <text x="980" y="170" fill="#9ca3af" font-size="10" text-anchor="middle">e lê documentos reais</text>
  <text x="980" y="188" fill="#6b7280" font-size="9" text-anchor="middle">contratos, políticas, Slack</text>

  <!-- ══════ LANGFUSE CAPTURE LAYER ══════ -->
  <rect x="40" y="234" width="1120" height="8" rx="4" fill="#f59e0b" opacity="0.3"/>
  <text x="600" y="257" fill="#fcd34d" font-size="11" font-weight="700" text-anchor="middle">↓  TUDO ABAIXO É CAPTURADO AUTOMATICAMENTE PELO LANGFUSE  ↓</text>

  <!-- ══════ WHAT LANGFUSE CAPTURES ══════ -->

  <!-- Capture box 1: conversation trace -->
  <rect x="40" y="270" width="260" height="130" rx="10" fill="#171717" stroke="#f59e0b" stroke-width="2"/>
  <rect x="40" y="270" width="260" height="36" rx="10" fill="#1c1700"/>
  <text x="170" y="293" fill="#fcd34d" font-size="12" font-weight="700" text-anchor="middle">📊  Trace da conversa</text>
  <text x="56" y="322" fill="#d1d5db" font-size="11">Registra a pergunta e a resposta</text>
  <text x="56" y="338" fill="#d1d5db" font-size="11">final, com quanto custou e</text>
  <text x="56" y="354" fill="#d1d5db" font-size="11">quanto tempo demorou no total.</text>
  <text x="56" y="374" fill="#6b7280" font-size="10">→ Aparece na lista de traces</text>
  <text x="56" y="388" fill="#6b7280" font-size="10">   com sessão e usuário</text>

  <!-- Capture box 2: span tree -->
  <rect x="320" y="270" width="260" height="130" rx="10" fill="#171717" stroke="#6366f1" stroke-width="2"/>
  <rect x="320" y="270" width="260" height="36" rx="10" fill="#12123a"/>
  <text x="450" y="293" fill="#a5b4fc" font-size="12" font-weight="700" text-anchor="middle">🌳  Árvore de etapas</text>
  <text x="336" y="322" fill="#d1d5db" font-size="11">Cada "passo" do agente vira um</text>
  <text x="336" y="338" fill="#d1d5db" font-size="11">nó na árvore: busca, leitura,</text>
  <text x="336" y="354" fill="#d1d5db" font-size="11">pensamento, resposta — tudo</text>
  <text x="336" y="370" fill="#d1d5db" font-size="11">conectado e com tempo medido.</text>
  <text x="336" y="388" fill="#6b7280" font-size="10">→ Aparece no detalhe do trace</text>

  <!-- Capture box 3: tokens & cost -->
  <rect x="600" y="270" width="260" height="130" rx="10" fill="#171717" stroke="#f59e0b" stroke-width="2"/>
  <rect x="600" y="270" width="260" height="36" rx="10" fill="#1c1700"/>
  <text x="730" y="293" fill="#fcd34d" font-size="12" font-weight="700" text-anchor="middle">💰  Tokens e custo</text>
  <text x="616" y="322" fill="#d1d5db" font-size="11">Soma tokens de entrada e saída</text>
  <text x="616" y="338" fill="#d1d5db" font-size="11">de todas as chamadas ao modelo.</text>
  <text x="616" y="354" fill="#d1d5db" font-size="11">Calcula o custo em dólares e</text>
  <text x="616" y="370" fill="#d1d5db" font-size="11">registra por modelo usado.</text>
  <text x="616" y="388" fill="#6b7280" font-size="10">→ Visível na lista e no detalhe</text>

  <!-- Capture box 4: prompt version -->
  <rect x="880" y="270" width="260" height="130" rx="10" fill="#171717" stroke="#3b82f6" stroke-width="2"/>
  <rect x="880" y="270" width="260" height="36" rx="10" fill="#0c1a2e"/>
  <text x="1010" y="293" fill="#93c5fd" font-size="12" font-weight="700" text-anchor="middle">📋  Versão das instruções</text>
  <text x="896" y="322" fill="#d1d5db" font-size="11">Registra qual versão e label</text>
  <text x="896" y="338" fill="#d1d5db" font-size="11">das instruções foi usada em</text>
  <text x="896" y="354" fill="#d1d5db" font-size="11">cada conversa. Permite saber</text>
  <text x="896" y="370" fill="#d1d5db" font-size="11">se mudança de prompt causou</text>
  <text x="896" y="386" fill="#6b7280" font-size="10">→ Nos metadados do trace</text>

  <!-- ══════ LANGFUSE VIEWS ══════ -->
  <text x="600" y="440" fill="#9ca3af" font-size="11" font-weight="700" text-anchor="middle">ONDE VER NO PAINEL</text>

  <rect x="40" y="456" width="260" height="80" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="170" y="478" fill="#f3f4f6" font-size="12" font-weight="700" text-anchor="middle">📋 Lista de Traces</text>
  <text x="56" y="496" fill="#9ca3af" font-size="10">Todas as conversas, filtráveis</text>
  <text x="56" y="512" fill="#9ca3af" font-size="10">por sessão, usuário, tag ou label</text>
  <text x="56" y="526" fill="#6b7280" font-size="9">Menu: Tracing</text>

  <rect x="320" y="456" width="260" height="80" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="450" y="478" fill="#f3f4f6" font-size="12" font-weight="700" text-anchor="middle">🔬 Detalhe do Trace</text>
  <text x="336" y="496" fill="#9ca3af" font-size="10">Árvore de etapas com tempo</text>
  <text x="336" y="512" fill="#9ca3af" font-size="10">de cada passo e metadados</text>
  <text x="336" y="526" fill="#6b7280" font-size="9">Clique em qualquer trace</text>

  <rect x="600" y="456" width="260" height="80" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="730" y="478" fill="#f3f4f6" font-size="12" font-weight="700" text-anchor="middle">📝 Prompt Management</text>
  <text x="616" y="496" fill="#9ca3af" font-size="10">Versões das instruções com</text>
  <text x="616" y="512" fill="#9ca3af" font-size="10">labels production / staging</text>
  <text x="616" y="526" fill="#6b7280" font-size="9">Menu: Prompt Management</text>

  <rect x="880" y="456" width="260" height="80" rx="8" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="1010" y="478" fill="#f3f4f6" font-size="12" font-weight="700" text-anchor="middle">🧪 Playground</text>
  <text x="896" y="496" fill="#9ca3af" font-size="10">Edite o prompt e re-execute</text>
  <text x="896" y="512" fill="#9ca3af" font-size="10">um trace para comparar</text>
  <text x="896" y="526" fill="#6b7280" font-size="9">Menu: Playground</text>

  <!-- ══════ BOTTOM: why it matters ══════ -->
  <rect x="40" y="558" width="1120" height="150" rx="10" fill="#171717" stroke="#374151" stroke-width="1.5"/>
  <text x="600" y="580" fill="#f3f4f6" font-size="14" font-weight="700" text-anchor="middle">🎯  Por que tudo isso importa?</text>
  <line x1="60" y1="588" x2="1140" y2="588" stroke="#2a2a2a" stroke-width="1"/>

  <text x="80" y="612" fill="#6ee7b7" font-size="12" font-weight="700">Sem observabilidade</text>
  <text x="80" y="630" fill="#9ca3af" font-size="11">O agente é uma caixa preta. Quando</text>
  <text x="80" y="646" fill="#9ca3af" font-size="11">a resposta é errada, você não sabe se</text>
  <text x="80" y="662" fill="#9ca3af" font-size="11">foi o banco, o modelo ou a instrução.</text>
  <text x="80" y="678" fill="#9ca3af" font-size="11">Você não sabe quanto custou.</text>
  <text x="80" y="694" fill="#9ca3af" font-size="11">Você não sabe se melhorou.</text>

  <line x1="380" y1="600" x2="380" y2="700" stroke="#2a2a2a" stroke-width="1"/>

  <text x="420" y="612" fill="#6ee7b7" font-size="12" font-weight="700">Com observabilidade</text>
  <text x="420" y="630" fill="#d1d5db" font-size="11">Você vê cada etapa da resposta.</text>
  <text x="420" y="646" fill="#d1d5db" font-size="11">Sabe exatamente quanto cada pergunta</text>
  <text x="420" y="662" fill="#d1d5db" font-size="11">custou e onde estava o gargalo.</text>
  <text x="420" y="678" fill="#d1d5db" font-size="11">Consegue comparar versões de instrução</text>
  <text x="420" y="694" fill="#d1d5db" font-size="11">antes de colocar em produção.</text>

  <line x1="720" y1="600" x2="720" y2="700" stroke="#2a2a2a" stroke-width="1"/>

  <text x="760" y="612" fill="#6ee7b7" font-size="12" font-weight="700">O que implementamos</text>
  <text x="760" y="630" fill="#93c5fd" font-size="10">Inc 1: Registrar cada busca no Neo4j como span</text>
  <text x="760" y="648" fill="#fcd34d" font-size="10">Inc 2: Capturar tokens e custo de cada modelo</text>
  <text x="760" y="666" fill="#6ee7b7" font-size="10">Inc 3: Rastrear sessão, usuário e ligar os spans</text>
  <text x="760" y="684" fill="#d8b4fe" font-size="10">Inc 4: Versionar instruções e comparar A/B</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="ai" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
  </defs>

</svg>
