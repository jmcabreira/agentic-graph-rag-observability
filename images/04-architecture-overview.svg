<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" font-family="Inter,Segoe UI,system-ui,sans-serif">
  <rect width="1100" height="680" fill="#0a0a0a"/>

  <text x="550" y="38" fill="#f3f4f6" font-size="20" font-weight="700" text-anchor="middle">Arquitetura de Observabilidade — Helix + Langfuse</text>
  <text x="550" y="58" fill="#6b7280" font-size="12" text-anchor="middle">Como os incrementos 1–4 se conectam</text>

  <!-- ══════ ROW 1: Entry points ══════ -->

  <!-- CLI box -->
  <rect x="60" y="90" width="180" height="80" rx="8" fill="#171717" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="118" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">CLI</text>
  <text x="150" y="134" fill="#9ca3af" font-size="10" text-anchor="middle">__main__.py</text>
  <text x="150" y="148" fill="#6b7280" font-size="9" text-anchor="middle">--id --session --user</text>
  <text x="150" y="162" fill="#6b7280" font-size="9" text-anchor="middle">--prompt-label</text>

  <!-- runner.py box -->
  <rect x="300" y="90" width="200" height="80" rx="8" fill="#171717" stroke="#3b82f6" stroke-width="2"/>
  <text x="400" y="118" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">runner.py</text>
  <text x="400" y="134" fill="#9ca3af" font-size="10" text-anchor="middle">ask()</text>
  <text x="400" y="148" fill="#6b7280" font-size="9" text-anchor="middle">1. fetch_prompt() → system_prompt</text>
  <text x="400" y="162" fill="#6b7280" font-size="9" text-anchor="middle">2. start_as_current_observation()</text>

  <!-- Claude Code CLI box -->
  <rect x="560" y="90" width="200" height="80" rx="8" fill="#171717" stroke="#6366f1" stroke-width="2"/>
  <text x="660" y="112" fill="#a5b4fc" font-size="13" font-weight="700" text-anchor="middle">Claude Code CLI</text>
  <text x="660" y="128" fill="#9ca3af" font-size="10" text-anchor="middle">claude_agent_sdk.query()</text>
  <text x="660" y="144" fill="#6b7280" font-size="9" text-anchor="middle">OTLP export automático</text>
  <text x="660" y="158" fill="#6b7280" font-size="9" text-anchor="middle">claude_code.interaction / llm_request</text>

  <!-- Helix MCP box -->
  <rect x="820" y="90" width="200" height="80" rx="8" fill="#171717" stroke="#10b981" stroke-width="2"/>
  <text x="920" y="112" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">Helix MCP Server</text>
  <text x="920" y="128" fill="#9ca3af" font-size="10" text-anchor="middle">server.py</text>
  <text x="920" y="144" fill="#6b7280" font-size="9" text-anchor="middle">4 tools com ctx: Context</text>
  <text x="920" y="158" fill="#6b7280" font-size="9" text-anchor="middle">neo4j-retrieval / read-source</text>

  <!-- Arrows row 1 -->
  <line x1="240" y1="130" x2="298" y2="130" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="500" y1="130" x2="558" y2="130" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowIndigo)"/>
  <line x1="760" y1="130" x2="818" y2="130" stroke="#10b981" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowGreen)"/>
  <text x="530" y="122" fill="#6b7280" font-size="9" text-anchor="middle">MCP HTTP</text>
  <text x="775" y="122" fill="#6b7280" font-size="9" text-anchor="middle">calls tools</text>

  <!-- ══════ ROW 2: observability infra ══════ -->

  <!-- Langfuse SDK -->
  <rect x="200" y="250" width="180" height="70" rx="8" fill="#171717" stroke="#f59e0b" stroke-width="2"/>
  <text x="290" y="274" fill="#fcd34d" font-size="12" font-weight="700" text-anchor="middle">Langfuse SDK v4</text>
  <text x="290" y="290" fill="#9ca3af" font-size="9" text-anchor="middle">tracing/__init__.py</text>
  <text x="290" y="304" fill="#6b7280" font-size="9" text-anchor="middle">get_client() · mask=_mask()</text>
  <text x="290" y="316" fill="#6b7280" font-size="9" text-anchor="middle">environment=workshop</text>

  <!-- OTLP export -->
  <rect x="440" y="250" width="180" height="70" rx="8" fill="#171717" stroke="#6366f1" stroke-width="2"/>
  <text x="530" y="274" fill="#a5b4fc" font-size="12" font-weight="700" text-anchor="middle">OTLP Exporter</text>
  <text x="530" y="290" fill="#9ca3af" font-size="9" text-anchor="middle">otel_env.py</text>
  <text x="530" y="304" fill="#6b7280" font-size="9" text-anchor="middle">OTEL_EXPORTER_OTLP_TRACES</text>
  <text x="530" y="316" fill="#6b7280" font-size="9" text-anchor="middle">→ /api/public/otel/v1/traces</text>

  <!-- Prompt fetch -->
  <rect x="680" y="250" width="180" height="70" rx="8" fill="#171717" stroke="#3b82f6" stroke-width="2"/>
  <text x="770" y="274" fill="#93c5fd" font-size="12" font-weight="700" text-anchor="middle">Prompt Fetch</text>
  <text x="770" y="290" fill="#9ca3af" font-size="9" text-anchor="middle">prompts/fetch.py</text>
  <text x="770" y="304" fill="#6b7280" font-size="9" text-anchor="middle">lf.get_prompt(name, label)</text>
  <text x="770" y="316" fill="#6b7280" font-size="9" text-anchor="middle">timeout=5s · fallback local</text>

  <!-- Arrows to row 2 -->
  <line x1="400" y1="170" x2="310" y2="248" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowAmber)"/>
  <line x1="660" y1="170" x2="530" y2="248" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowIndigo)"/>
  <line x1="400" y1="170" x2="750" y2="248" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <line x1="920" y1="170" x2="300" y2="248" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowAmber)"/>

  <!-- ══════ ROW 3: Langfuse backend ══════ -->

  <rect x="200" y="390" width="560" height="80" rx="8" fill="#171717" stroke="#374151" stroke-width="1.5"/>
  <rect x="200" y="390" width="4" height="80" rx="2" fill="#f59e0b"/>
  <text x="480" y="414" fill="#fcd34d" font-size="14" font-weight="700" text-anchor="middle">Langfuse (self-hosted)</text>
  <text x="480" y="432" fill="#9ca3af" font-size="10" text-anchor="middle">Redis → Worker → ClickHouse · MinIO (S3) · Postgres</text>
  <text x="310" y="456" fill="#6b7280" font-size="9" text-anchor="middle">OTLP ingestion</text>
  <text x="480" y="456" fill="#6b7280" font-size="9" text-anchor="middle">event propagation</text>
  <text x="650" y="456" fill="#6b7280" font-size="9" text-anchor="middle">prompt storage</text>

  <!-- Arrows to row 3 -->
  <line x1="290" y1="320" x2="350" y2="388" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="530" y1="320" x2="490" y2="388" stroke="#6366f1" stroke-width="2" marker-end="url(#arrowIndigo)"/>
  <line x1="770" y1="320" x2="610" y2="388" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ══════ ROW 4: Langfuse UI ══════ -->

  <rect x="200" y="510" width="130" height="60" rx="6" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="265" y="534" fill="#d1d5db" font-size="11" font-weight="600" text-anchor="middle">Tracing</text>
  <text x="265" y="550" fill="#6b7280" font-size="9" text-anchor="middle">spans · sessions</text>
  <text x="265" y="562" fill="#6b7280" font-size="9" text-anchor="middle">users · tags · cost</text>

  <rect x="345" y="510" width="130" height="60" rx="6" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="410" y="534" fill="#d1d5db" font-size="11" font-weight="600" text-anchor="middle">Trace Detail</text>
  <text x="410" y="550" fill="#6b7280" font-size="9" text-anchor="middle">span tree · metadata</text>
  <text x="410" y="562" fill="#6b7280" font-size="9" text-anchor="middle">prompt_version/label</text>

  <rect x="490" y="510" width="130" height="60" rx="6" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="555" y="534" fill="#d1d5db" font-size="11" font-weight="600" text-anchor="middle">Prompt Mgmt</text>
  <text x="555" y="550" fill="#6b7280" font-size="9" text-anchor="middle">versões · labels</text>
  <text x="555" y="562" fill="#6b7280" font-size="9" text-anchor="middle">production/staging</text>

  <rect x="635" y="510" width="130" height="60" rx="6" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="1"/>
  <text x="700" y="534" fill="#d1d5db" font-size="11" font-weight="600" text-anchor="middle">Playground</text>
  <text x="700" y="550" fill="#6b7280" font-size="9" text-anchor="middle">editar prompt ao vivo</text>
  <text x="700" y="562" fill="#6b7280" font-size="9" text-anchor="middle">re-rodar trace</text>

  <line x1="380" y1="470" x2="265" y2="508" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="420" y1="470" x2="410" y2="508" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="500" y1="470" x2="555" y2="508" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="600" y1="470" x2="700" y2="508" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ══════ Increment badges ══════ -->
  <rect x="790" y="390" width="280" height="180" rx="8" fill="#171717" stroke="#374151" stroke-width="1"/>
  <text x="800" y="410" fill="#9ca3af" font-size="11" font-weight="700">INCREMENTOS</text>
  <rect x="800" y="420" width="260" height="24" rx="4" fill="#1e3a5f"/>
  <text x="810" y="436" fill="#93c5fd" font-size="10" font-weight="600">Inc 1 — MCP tools instrumentadas</text>
  <rect x="800" y="450" width="260" height="24" rx="4" fill="#1c1700"/>
  <text x="810" y="466" fill="#fcd34d" font-size="10" font-weight="600">Inc 2 — OTLP + model usage</text>
  <rect x="800" y="480" width="260" height="24" rx="4" fill="#052e16"/>
  <text x="810" y="496" fill="#6ee7b7" font-size="10" font-weight="600">Inc 3 — sessions, users, traceparent</text>
  <rect x="800" y="510" width="260" height="24" rx="4" fill="#1a0533"/>
  <text x="810" y="526" fill="#d8b4fe" font-size="10" font-weight="600">Inc 4 — prompt management</text>
  <text x="800" y="558" fill="#4b5563" font-size="9">push.py · fetch.py · promote</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowIndigo" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

</svg>
