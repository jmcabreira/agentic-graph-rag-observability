<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" font-family="Inter,Segoe UI,system-ui,sans-serif">
  <rect width="1200" height="780" fill="#0f0f0f"/>

  <text x="600" y="36" fill="#f3f4f6" font-size="17" font-weight="700" text-anchor="middle">Langfuse — Detalhe de um Trace</text>
  <text x="600" y="56" fill="#6b7280" font-size="12" text-anchor="middle">Radiografia completa de uma pergunta — cada etapa que o sistema executou, quanto tempo levou e quanto custou</text>

  <!-- Sidebar -->
  <rect x="0" y="70" width="180" height="710" fill="#171717"/>
  <text x="16" y="102" fill="#888" font-size="11" font-weight="600">LANGFUSE</text>
  <rect x="8" y="112" width="164" height="28" rx="6" fill="#1f2937"/>
  <text x="16" y="130" fill="#f3f4f6" font-size="12">🔍 Tracing</text>

  <!-- Span tree panel -->
  <rect x="186" y="70" width="520" height="490" fill="#0f0f0f"/>
  <text x="196" y="94" fill="#9ca3af" font-size="11" font-weight="600">ÁRVORE DE ETAPAS</text>

  <!-- AGENT root -->
  <rect x="196" y="102" width="490" height="36" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="196" y="102" width="4" height="36" rx="2" fill="#3b82f6"/>
  <text x="210" y="118" fill="#93c5fd" font-size="11" font-weight="700">AGENTE</text>
  <text x="264" y="118" fill="#f3f4f6" font-size="12" font-weight="600">Conversa completa</text>
  <text x="264" y="130" fill="#6b7280" font-size="10">Pergunta entrada → Resposta final</text>
  <text x="618" y="122" fill="#9ca3af" font-size="10">336s</text>

  <!-- interaction -->
  <rect x="216" y="146" width="470" height="30" rx="4" fill="#1a1a2e" stroke="#6366f1" stroke-width="1"/>
  <rect x="216" y="146" width="3" height="30" rx="1" fill="#6366f1"/>
  <text x="228" y="159" fill="#a5b4fc" font-size="10" font-weight="700">PROCESSO INTERNO</text>
  <text x="318" y="159" fill="#d1d5db" font-size="11">Loop de raciocínio do agente</text>
  <text x="228" y="170" fill="#6b7280" font-size="9">Claude Code gerencia internamente — cada volta que o agente "pensa"</text>
  <text x="618" y="162" fill="#9ca3af" font-size="10">292s</text>

  <!-- llm_request 1 -->
  <rect x="236" y="184" width="450" height="26" rx="3" fill="#1a1a1a" stroke="#374151" stroke-width="1"/>
  <rect x="236" y="184" width="3" height="26" rx="1" fill="#f59e0b"/>
  <text x="248" y="198" fill="#fcd34d" font-size="10" font-weight="700">PENSAMENTO</text>
  <text x="318" y="198" fill="#d1d5db" font-size="11">Modelo de linguagem processa e decide</text>
  <text x="618" y="198" fill="#9ca3af" font-size="10">7s</text>

  <!-- search_context -->
  <rect x="236" y="218" width="450" height="26" rx="3" fill="#1a1a1a" stroke="#374151" stroke-width="1"/>
  <rect x="236" y="218" width="3" height="26" rx="1" fill="#10b981"/>
  <text x="248" y="232" fill="#6ee7b7" font-size="10" font-weight="700">BUSCA</text>
  <text x="296" y="232" fill="#d1d5db" font-size="11">search_context — busca fatos no grafo</text>
  <text x="618" y="232" fill="#9ca3af" font-size="10">23s</text>

  <!-- neo4j-retrieval -->
  <rect x="256" y="252" width="430" height="30" rx="3" fill="#0f1f2d" stroke="#0ea5e9" stroke-width="1"/>
  <rect x="256" y="252" width="3" height="30" rx="1" fill="#0ea5e9"/>
  <text x="268" y="265" fill="#7dd3fc" font-size="10" font-weight="700">BANCO DE DADOS</text>
  <text x="348" y="265" fill="#f3f4f6" font-size="11">Neo4j — consulta no grafo de conhecimento</text>
  <text x="268" y="277" fill="#6b7280" font-size="9">Fatos retornados: 8  |  Fontes: contrato, política  |  Neo4j</text>
  <text x="618" y="270" fill="#9ca3af" font-size="10">15s</text>

  <!-- read_source -->
  <rect x="236" y="290" width="450" height="26" rx="3" fill="#1a1a1a" stroke="#374151" stroke-width="1"/>
  <rect x="236" y="290" width="3" height="26" rx="1" fill="#10b981"/>
  <text x="248" y="304" fill="#6ee7b7" font-size="10" font-weight="700">LEITURA</text>
  <text x="296" y="304" fill="#d1d5db" font-size="11">read_source — lê o documento original</text>
  <text x="618" y="304" fill="#9ca3af" font-size="10">3.5s</text>

  <!-- read-source child -->
  <rect x="256" y="324" width="430" height="24" rx="3" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
  <text x="268" y="338" fill="#6b7280" font-size="10">📄  Orion_Freight_Systems_MSA_2025-08-15.pdf — cláusula 7.3</text>
  <text x="618" y="338" fill="#9ca3af" font-size="10">99ms</text>

  <!-- llm_request 2 -->
  <rect x="236" y="356" width="450" height="26" rx="3" fill="#1a1a1a" stroke="#374151" stroke-width="1"/>
  <rect x="236" y="356" width="3" height="26" rx="1" fill="#f59e0b"/>
  <text x="248" y="370" fill="#fcd34d" font-size="10" font-weight="700">PENSAMENTO</text>
  <text x="318" y="370" fill="#d1d5db" font-size="11">Modelo analisa os documentos e compõe a resposta</text>
  <text x="618" y="370" fill="#9ca3af" font-size="10">16s</text>

  <!-- model-call -->
  <rect x="216" y="390" width="470" height="30" rx="4" fill="#1a1a1a" stroke="#374151" stroke-width="1"/>
  <rect x="216" y="390" width="3" height="30" rx="1" fill="#f59e0b"/>
  <text x="228" y="403" fill="#fcd34d" font-size="10" font-weight="700">CUSTO CONSOLIDADO</text>
  <text x="348" y="403" fill="#d1d5db" font-size="11">Tokens e custo total de todos os pensamentos</text>
  <text x="228" y="415" fill="#6b7280" font-size="9">entrada: 48.000 tokens · saída: 3.200 tokens · custo: $0.08</text>
  <text x="618" y="407" fill="#9ca3af" font-size="10">180ms</text>

  <!-- divider -->
  <line x1="196" y1="440" x2="700" y2="440" stroke="#2a2a2a" stroke-width="1"/>

  <!-- Metadata panel mockup -->
  <rect x="196" y="450" width="490" height="100" rx="6" fill="#171717" stroke="#2a2a2a" stroke-width="1"/>
  <text x="210" y="468" fill="#6b7280" font-size="11" font-weight="600">METADADOS DA CONVERSA</text>
  <line x1="210" y1="474" x2="676" y2="474" stroke="#2a2a2a" stroke-width="1"/>
  <text x="210" y="490" fill="#6b7280" font-size="10">Custo total</text>
  <text x="380" y="490" fill="#d1d5db" font-size="10">$0.1762</text>
  <text x="210" y="506" fill="#6b7280" font-size="10">Duração</text>
  <text x="380" y="506" fill="#d1d5db" font-size="10">291 segundos</text>
  <text x="210" y="522" fill="#fcd34d" font-size="10" font-weight="600">Versão das instruções usada</text>
  <text x="380" y="522" fill="#fcd34d" font-size="10">production — versão 1</text>
  <text x="210" y="538" fill="#fcd34d" font-size="10" font-weight="600">Origem das instruções</text>
  <text x="380" y="538" fill="#fcd34d" font-size="10">langfuse (buscou online) ou local (fallback)</text>

  <!-- ───── RIGHT PANEL: annotations ───── -->
  <rect x="720" y="70" width="468" height="490" fill="#0f0f0f"/>

  <!-- Ann 1: o que é a árvore -->
  <rect x="730" y="96" width="446" height="96" rx="8" fill="#0c1a2e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="746" y="116" fill="#93c5fd" font-size="12" font-weight="700">🔵  Por que a árvore é útil?</text>
  <text x="746" y="134" fill="#d1d5db" font-size="11">Sem ela, você só vê "a resposta demorou 291s".</text>
  <text x="746" y="150" fill="#d1d5db" font-size="11">Com ela, você vê que 23s foram gastos buscando</text>
  <text x="746" y="166" fill="#d1d5db" font-size="11">no banco de dados. Se isso for lento demais,</text>
  <text x="746" y="182" fill="#d1d5db" font-size="11">você sabe exatamente onde está o gargalo.</text>

  <!-- Ann 2: cores -->
  <rect x="730" y="204" width="446" height="130" rx="8" fill="#171717" stroke="#374151" stroke-width="1.5"/>
  <text x="746" y="224" fill="#9ca3af" font-size="12" font-weight="700">🎨  O que significa cada cor?</text>
  <rect x="746" y="234" width="10" height="10" rx="2" fill="#3b82f6"/>
  <text x="762" y="243" fill="#d1d5db" font-size="11">Azul — a conversa inteira (início ao fim)</text>
  <rect x="746" y="254" width="10" height="10" rx="2" fill="#6366f1"/>
  <text x="762" y="263" fill="#d1d5db" font-size="11">Roxo — o raciocínio interno do agente</text>
  <rect x="746" y="274" width="10" height="10" rx="2" fill="#f59e0b"/>
  <text x="762" y="283" fill="#d1d5db" font-size="11">Amarelo — chamada ao modelo de linguagem (paga)</text>
  <rect x="746" y="294" width="10" height="10" rx="2" fill="#10b981"/>
  <text x="762" y="303" fill="#d1d5db" font-size="11">Verde — busca ou leitura de documento</text>
  <rect x="746" y="314" width="10" height="10" rx="2" fill="#0ea5e9"/>
  <text x="762" y="323" fill="#d1d5db" font-size="11">Ciano — consulta no banco de dados (Neo4j)</text>

  <!-- Ann 3: metadata -->
  <rect x="730" y="346" width="446" height="100" rx="8" fill="#1c1700" stroke="#fcd34d" stroke-width="1.5"/>
  <text x="746" y="366" fill="#fcd34d" font-size="12" font-weight="700">📋  O que são os metadados?</text>
  <text x="746" y="384" fill="#d1d5db" font-size="11">São informações extras que registramos junto ao trace.</text>
  <text x="746" y="400" fill="#d1d5db" font-size="11">O mais importante: qual versão das instruções foi usada.</text>
  <text x="746" y="416" fill="#d1d5db" font-size="11">Assim, se a qualidade da resposta mudar, sabemos se foi</text>
  <text x="746" y="432" fill="#d1d5db" font-size="11">por causa de uma mudança nas instruções ou outra causa.</text>

  <!-- Ann 4: traceparent -->
  <rect x="730" y="458" width="446" height="96" rx="8" fill="#071e2e" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="746" y="478" fill="#7dd3fc" font-size="12" font-weight="700">🔗  Por que as etapas estão conectadas?</text>
  <text x="746" y="496" fill="#d1d5db" font-size="11">O agente envia um "ID de rastreamento" (traceparent) para</text>
  <text x="746" y="512" fill="#d1d5db" font-size="11">cada busca que faz. O banco de dados usa esse ID para</text>
  <text x="746" y="528" fill="#d1d5db" font-size="11">registrar seus próprios spans como filhos da conversa.</text>
  <text x="746" y="544" fill="#6b7280" font-size="10">Sem isso, as buscas apareceriam soltas, sem pai — impossível rastrear.</text>

  <!-- Bottom row: how it helps -->
  <rect x="186" y="568" width="1002" height="90" rx="8" fill="#171717" stroke="#374151" stroke-width="1.5"/>
  <text x="204" y="588" fill="#f3f4f6" font-size="12" font-weight="700">🎯  Como este painel ajuda a melhorar o sistema?</text>
  <text x="204" y="608" fill="#d1d5db" font-size="11">• Resposta lenta?  → veja qual etapa demorou mais e otimize ela especificamente</text>
  <text x="204" y="624" fill="#d1d5db" font-size="11">• Resposta errada?  → veja quais documentos foram lidos e se o banco retornou os fatos certos</text>
  <text x="204" y="640" fill="#d1d5db" font-size="11">• Custo alto?  → veja quantos tokens cada "pensamento" consumiu e se havia como reduzir o contexto</text>
  <text x="204" y="656" fill="#6b7280" font-size="10">Tudo isso sem precisar adicionar logs manualmente — o Langfuse captura automaticamente cada etapa.</text>

</svg>
