  <text x="812" y="138" fill="#d1d5db" font-size="10">uv run python -m observability.prompts.push</text>
  <text x="812" y="154" fill="#d1d5db" font-size="10">↳ sobe production (v1)</text>
  <text x="812" y="170" fill="#d1d5db" font-size="10">push --label staging --system-file candidates/</text>
  <text x="812" y="184" fill="#d1d5db" font-size="10">↳ sobe staging (v2)</text>

  <!-- Annotation 2: tool descriptions -->
